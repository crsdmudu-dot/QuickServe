name: iOS Native Journeys (Phase 3F flows on iOS Simulator)

# Runs the Phase 3F customer/provider native journeys on an iOS Simulator using a hosted
# macOS runner (no local Mac/iPhone needed — trigger from anywhere via the Actions tab or
# `gh workflow run`). It downloads the EAS iOS *simulator* build (no Apple signing), boots a
# simulator, installs the app, and runs the Maestro journeys + backend verification + cleanup.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   EXPO_TOKEN               - Expo access token (eas-cli auth to fetch the build)
#   QA_SUPABASE_URL          - dedicated QA Supabase project URL
#   QA_SUPABASE_ANON_KEY     - QA anon (public) key
#   QA_SERVICE_ROLE_KEY      - QA service-role key (setup-verify / assignment / cleanup only)
#   QA_CUSTOMER_EMAIL / QA_CUSTOMER_PASSWORD
#   QA_PROVIDER1_EMAIL / QA_PROVIDER1_PASSWORD
#   QA_ADMIN_EMAIL / QA_ADMIN_PASSWORD
#       Service Details V1.6 — used for the MANUAL mobile-admin surface certification only.
#       The automated Service Details suite below does not require them and will run without
#       them; they are wired here so the admin portion needs no further workflow change.
# (No product secrets are embedded; simulator builds need no Apple credentials.)

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "EAS iOS build ID to use (blank = latest finished ios-simulator build)"
        required: false
        default: ""

jobs:
  ios-journeys:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      QA_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
      QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
      QA_SERVICE_ROLE_KEY: ${{ secrets.QA_SERVICE_ROLE_KEY }}
      QA_CUSTOMER_EMAIL: ${{ secrets.QA_CUSTOMER_EMAIL }}
      QA_CUSTOMER_PASSWORD: ${{ secrets.QA_CUSTOMER_PASSWORD }}
      QA_PROVIDER1_EMAIL: ${{ secrets.QA_PROVIDER1_EMAIL }}
      QA_PROVIDER1_PASSWORD: ${{ secrets.QA_PROVIDER1_PASSWORD }}
      QA_ADMIN_EMAIL: ${{ secrets.QA_ADMIN_EMAIL }}
      QA_ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install tools (eas-cli, Maestro)
        run: |
          set -euxo pipefail
          npm install -g eas-cli
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Install app dependencies (eas needs node_modules to resolve the expo-router config plugin)
        run: npm ci

      - name: Resolve and download the EAS iOS simulator build
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.build_id }}" ]; then
            URL=$(eas build:view "${{ github.event.inputs.build_id }}" --json | jq -r '.artifacts.applicationArchiveUrl')
          else
            URL=$(eas build:list --platform ios --profile ios-simulator --status finished --limit 1 --json --non-interactive | jq -r '.[0].artifacts.applicationArchiveUrl')
          fi
          test -n "$URL" && test "$URL" != "null" || { echo "No iOS simulator build artifact found — build one first: eas build -p ios --profile ios-simulator"; exit 1; }
          echo "Downloading iOS simulator build (URL redacted)…"
          curl -fSL "$URL" -o app.tar.gz
          mkdir -p app && tar -xzf app.tar.gz -C app
          APP=$(find app -maxdepth 3 -name "*.app" | head -1)
          test -n "$APP" || { echo "No .app in artifact"; ls -R app; exit 1; }
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"
          echo "App: $APP"

      - name: Boot iOS simulator and install the app
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name|test("iPhone"))][-1].udid')
          test -n "$DEVICE_ID" || { echo "No available iPhone simulator"; xcrun simctl list devices available; exit 1; }
          echo "Simulator UDID: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          open -a Simulator || true
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          echo "Installed $APP_PATH"
          xcrun simctl listapps "$DEVICE_ID" | grep -i kwikserve || true

      - name: Entry reachability smoke (iOS deterministic entry)
        run: maestro test qa/native/flows/entry-reachability.yaml

      - name: Phase 4E.2 — cold-relaunch resilience (logged-out + logged-in, no black screen)
        run: |
          maestro test qa/native/flows/cold-relaunch.yaml \
            -e CUST_EMAIL="$QA_CUSTOMER_EMAIL" -e CUST_PW="$QA_CUSTOMER_PASSWORD"

      - name: Phase 4E.2 — Booking Detail back-navigation (visible Back → My Bookings, no trap)
        run: |
          maestro test qa/native/flows/booking-detail-back.yaml \
            -e CUST_EMAIL="$QA_CUSTOMER_EMAIL" -e CUST_PW="$QA_CUSTOMER_PASSWORD"

      - name: Phase 4E.2 — customer nav/search regression (Android-hurdle replay)
        run: |
          maestro test qa/native/flows/customer-nav-search.yaml \
            -e CUST_EMAIL="$QA_CUSTOMER_EMAIL" -e CUST_PW="$QA_CUSTOMER_PASSWORD"

      # Service Details V1.6 — the five CORE flows, via the existing runner (never re-listed here).
      # Runs BEFORE the remaining Phase 4E.2 flows: this pipeline is serial and fail-fast, and a
      # flake in an unrelated legacy step was preventing the active certification target from
      # executing at all (run 32112036669). The stable smoke checks above stay first because they
      # are prerequisites — they prove login, cold start and navigation work before anything else
      # is attempted. The runner is self-cleaning: only booking-duplicate-distinct.yaml creates
      # data, under its own SDV15-<epoch> marker, removed by an EXIT trap.
      - name: Service Details V1.6 — CORE flows (House Cleaning, Massage, Towing gate, Address Back, distinct-duplicate)
        run: bash qa/native/ios-service-details.sh

      - name: Phase 4E.2 — notification-center refresh (Android defect #1 replay)
        run: bash qa/native/ios-notif-refresh.sh

      - name: Phase 4E.2 — delivery-address journey (Places New autocomplete + last-mile fields)
        run: |
          maestro test qa/native/flows/address-journey.yaml \
            -e CUST_EMAIL="$QA_CUSTOMER_EMAIL" -e CUST_PW="$QA_CUSTOMER_PASSWORD"

      - name: Phase 4E.2 — booking duplicate warning + idempotency journey
        run: bash qa/native/ios-booking-duplicate.sh

      - name: Run Phase 3F customer/provider journeys on iOS
        run: bash qa/native/ios-journeys.sh

      # Grocery runs LAST OF ALL. Its deep-form iOS accessibility limitation is reproducible and
      # fail-fast-fatal, and while it sat inside the core suite it was preventing the four legacy
      # regression steps above from ever executing. This is evidence ordering only: the flow is
      # unchanged, its exit code is NOT swallowed, and there is deliberately no continue-on-error —
      # a Grocery failure still fails the workflow.
      - name: Service Details V1.6 — Grocery flow (known deep-form limitation; runs last)
        run: bash qa/native/ios-service-details-grocery.sh

      - name: Upload Maestro artifacts (screenshots / logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-ios-artifacts
          path: |
            ~/.maestro/tests
            ${{ github.workspace }}/*.png
          if-no-files-found: ignore
          retention-days: 14
