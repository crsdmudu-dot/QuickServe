# Service Details V1.5 — MASSAGE: the locked V1.2 product decisions, asserted at the UI level.
#
# Three of those decisions are invisible in the happy path and are exactly the kind of thing a
# later edit could undo by accident, so they are pinned here as NEGATIVE assertions:
#   1. ONE booking = ONE person. `number_of_people` was removed by principal decision because
#      multi-therapist assignment does not exist; no party-size control may reappear.
#   2. Therapist gender is a PREFERENCE, and the screen must say it is not guaranteed.
#   3. Media is disabled for this service by locked decision.
#
# Nothing is placed — the flow stops at the Address step.
#
# WHAT THE NEGATIVES BELOW PROVE. Maestro's visibility assertions are VIEWPORT-scoped on iOS, so a
# control that existed but sat below the fold would report as not visible exactly like one that was
# never rendered. These assertNotVisible lines are therefore CORROBORATION, not the authoritative
# guarantee. The authoritative pins are unit tests over the configuration itself:
# src/constants/service-forms.test.ts — "Massage is ONE person per booking in V1 — no party-size
# question" (asserts no number_of_people question exists) and "Massage has no media and states
# gender is a preference, not a guarantee". Do not weaken either layer on the strength of the other.
#
# Params via -e: CUST_EMAIL, CUST_PW.
appId: ke.co.hiredcorp.kwikserve
---
- runFlow: { file: steps/login-customer.yaml }

- scrollUntilVisible: { element: { text: ".*Massage.*" }, direction: DOWN, timeout: 15000 }
- tapOn: ".*Massage.*"
- extendedWaitUntil: { visible: "Step 1 of 5", timeout: 15000 }
- assertVisible: ".*What kind of massage.*"
- takeScreenshot: sd-ms-01-step1

# ── (1) One person per booking — no party-size question, in any wording ───────
- assertNotVisible: { id: "question-number_of_people" }
- assertNotVisible: { id: "input-number_of_people" }
- assertNotVisible: ".*How many people.*"
- assertNotVisible: ".*Number of people.*"

# ── (3) Media disabled for Massage ────────────────────────────────────────────
- assertNotVisible: { id: "service-details-media" }

# ── Answer the form ───────────────────────────────────────────────────────────
- tapOn: { id: "option-variant-full_body" }
- extendedWaitUntil: { visible: { id: "question-duration_minutes" }, timeout: 8000 }
- scrollUntilVisible: { element: { id: "option-duration_minutes-60" }, direction: DOWN, timeout: 12000 }
- tapOn: { id: "option-duration_minutes-60" }

# ── (2) Gender is a preference, and the screen says so ────────────────────────
- scrollUntilVisible: { element: { id: "question-therapist_gender_preference" }, direction: DOWN, timeout: 12000 }
- assertVisible: ".*Do you have a preference for the therapist.*"
# The disclaimer renders BELOW the option buttons, so the question block being on screen does not
# put the disclaimer on screen too.
- scrollUntilVisible: { element: { id: "disclaimer-therapist_gender_preference" }, direction: DOWN, timeout: 12000 }
- assertVisible: { id: "disclaimer-therapist_gender_preference" }
- assertVisible: ".*isn.t guaranteed.*"
# The disclaimer sits below the options, so scrolling to it moved them off-screen.
# Same header-occlusion class as House Cleaning kitchen_only (run 32150749532): the DOWN scroll
# above pushes these options just off the top, where "visible" does not mean tappable.
- scrollUntilVisible: { element: { id: "option-therapist_gender_preference-female" }, direction: UP, timeout: 12000, centerElement: true }
- tapOn: { id: "option-therapist_gender_preference-female" }
- takeScreenshot: sd-ms-02-preference

# Still no party-size control after the form is fully disclosed.
- assertNotVisible: ".*How many people.*"

# ── Continue reaches Address ──────────────────────────────────────────────────
- scrollUntilVisible: { element: { id: "service-details-continue" }, direction: DOWN, timeout: 12000 }
- tapOn: { id: "service-details-continue" }
- extendedWaitUntil: { visible: "Your Address", timeout: 15000 }
- assertVisible: "Step 2 of 5"
- takeScreenshot: sd-ms-03-address
