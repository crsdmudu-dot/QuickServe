# Update 74 — the provider's job screen after the customer cancelled.
#
# NOT RUN YET (written 2026-10-02; to run later on a QA build, after customer-cancel-booking.yaml has
# cancelled a booking assigned to this provider).
#
# Params via -e: PROV_EMAIL, PROV_PW, SERVICE. Credentials are never stored here.
appId: ke.co.hiredcorp.kwikserve
---
- launchApp: { clearState: true }
- extendedWaitUntil: { visible: "Get Started", timeout: 40000 }
- repeat:
    times: 8
    commands:
      - runFlow:
          when: { visible: { id: "login-link" } }
          commands:
            - tapOn: { id: "login-link" }
            - extendedWaitUntil: { visible: "Welcome back", timeout: 3000, optional: true }
- extendedWaitUntil: { visible: "Welcome back", timeout: 10000 }
- tapOn: "you@example.com"
- inputText: "${PROV_EMAIL}"
- tapOn: "Your password"
- inputText: "${PROV_PW}"
- tapOn: "Welcome back"
- tapOn: "Continue"
- runFlow: { when: { visible: "Don.t Allow" }, commands: [ { tapOn: "Don.t Allow" } ] }
- extendedWaitUntil: { visible: { id: "accept-terms-agree" }, timeout: 8000, optional: true }
- runFlow: { when: { visible: { id: "accept-terms-agree" } }, commands: [ { tapOn: { id: "accept-terms-agree" } } ] }
- extendedWaitUntil: { visible: "My Jobs", timeout: 30000 }
- extendedWaitUntil: { visible: ".*${SERVICE}.*", timeout: 20000 }
- tapOn: ".*${SERVICE}.*"
- runFlow: { when: { visible: "No thanks" }, commands: [ { tapOn: "No thanks" } ] }
- runFlow: { when: { visible: "Don.t Allow" }, commands: [ { tapOn: "Don.t Allow" } ] }
- extendedWaitUntil: { visible: "Job Detail", timeout: 20000 }
- assertVisible: { id: "provider-job-cancelled" }
- assertVisible: "No further action"
- assertNotVisible: "In progress"
