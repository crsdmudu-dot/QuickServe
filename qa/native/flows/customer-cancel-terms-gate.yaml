# Update 74 (OD-74-8 DEFAULT) — a customer who has NOT accepted the current Terms can still cancel a
# booking from the Terms screen, as account deletion is reachable from it.
#
# NOT RUN YET (written 2026-10-02; to run later on a QA build).
# Prerequisite (QA only): a customer account that has not accepted the current Terms version, with one
# cancellable ${SERVICE} booking. This flow must NOT tap "I agree".
#
# Params via -e: CUST_EMAIL, CUST_PW, SERVICE. Credentials are never stored here.
appId: ke.co.hiredcorp.kwikserve
---
- launchApp: { clearState: true }
- extendedWaitUntil: { visible: "Get Started", timeout: 30000 }
- repeat:
    times: 8
    commands:
      - runFlow:
          when: { visible: { id: "login-link" } }
          commands:
            - tapOn: { id: "login-link" }
            - extendedWaitUntil: { visible: "Welcome back", timeout: 3000, optional: true }
- extendedWaitUntil: { visible: "Welcome back", timeout: 10000 }
- tapOn: "you@example.com"
- inputText: "${CUST_EMAIL}"
- tapOn: "Your password"
- inputText: "${CUST_PW}"
- tapOn: "Welcome back"
- tapOn: "Continue"
- runFlow: { when: { visible: "Don.t Allow" }, commands: [ { tapOn: "Don.t Allow" } ] }
- extendedWaitUntil: { visible: "Before you continue", timeout: 20000 }
- scrollUntilVisible: { element: { id: "accept-terms-cancel-booking" }, direction: DOWN, timeout: 10000 }
- tapOn: { id: "accept-terms-cancel-booking" }
- extendedWaitUntil: { visible: "Choose the booking you want to cancel.*", timeout: 15000 }
- tapOn: { id: "cancel-list-open-.*" }
- extendedWaitUntil: { visible: "Cancel this booking?", timeout: 15000 }
- scrollUntilVisible: { element: { id: "cancel-confirm" }, direction: DOWN, timeout: 10000 }
- tapOn: { id: "cancel-confirm" }
- extendedWaitUntil: { visible: "Booking cancelled", timeout: 20000 }
# Leaving the cancellation screens returns to the Terms screen (the gate still applies elsewhere).
- tapOn: { id: "cancel-back-to-booking" }
- extendedWaitUntil: { visible: "Before you continue|Cancel a booking", timeout: 15000 }
