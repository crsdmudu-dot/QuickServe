# Phase 4E.2 — iOS Simulator certification of the booking duplicate-warning + idempotency UX.
#
# Creates booking A, then starts booking B for the SAME service at the SAME manual address so the
# advisory duplicate warning fires at Place Booking. Asserts the native Alert + its two actions,
# then taps "Book another anyway" and confirms booking B is created (a new logical booking with
# its own idempotency identity). Both bookings carry ${MARKER} in notes+address so the orchestrator
# can find + delete them (customers have no delete RLS). Uses manual address entry on purpose —
# the Google Places/address flow is certified separately and is NOT exercised here.
#
# Params via -e: CUST_EMAIL, CUST_PW, MARKER
appId: ke.co.hiredcorp.kwikserve
---
- launchApp: { clearState: true }
- extendedWaitUntil: { visible: "Get Started", timeout: 30000 }
- repeat:
    times: 8
    commands:
      - runFlow:
          when: { visible: { id: "login-link" } }
          commands:
            - tapOn: { id: "login-link" }
            - extendedWaitUntil: { visible: "Welcome back", timeout: 3000, optional: true }
- extendedWaitUntil: { visible: "Welcome back", timeout: 10000 }
- tapOn: "you@example.com"
- inputText: "${CUST_EMAIL}"
- tapOn: "Your password"
- inputText: "${CUST_PW}"
- tapOn: "Welcome back"
- tapOn: "Continue"
- runFlow: { when: { visible: "Don.t Allow" }, commands: [ { tapOn: "Don.t Allow" } ] }
- extendedWaitUntil: { visible: "What service do you need today?", timeout: 25000 }

# ── Booking A (House Cleaning · manual address · marker) ──────────────────────
- tapOn: ".*House Cleaning.*"
- extendedWaitUntil: { visible: "Your Address", timeout: 15000 }
- tapOn: "Enter address manually"
- extendedWaitUntil: { visible: "123 Main St, City", timeout: 8000 }
- tapOn: "123 Main St, City"
- inputText: "QA-DUP ${MARKER} Rd Nairobi"
- tapOn: "Your Address"
- scrollUntilVisible: { element: { text: "Continue" }, direction: DOWN, timeout: 15000 }
- tapOn: "Continue"
- extendedWaitUntil: { visible: "When do you need it?", timeout: 15000 }
- tapOn: ".*ASAP.*"
- scrollUntilVisible: { element: { text: "Continue" }, direction: DOWN, timeout: 15000 }
- tapOn: "Continue"
- extendedWaitUntil: { visible: "Any special notes?", timeout: 15000 }
- tapOn: "E.g. use the back entrance, bring your own supplies…"
- inputText: "${MARKER}"
- tapOn: "Any special notes?"
- scrollUntilVisible: { element: { text: "Continue" }, direction: DOWN, timeout: 15000 }
- tapOn: "Continue"
- extendedWaitUntil: { visible: "Review your booking", timeout: 15000 }
- scrollUntilVisible: { element: { text: "Place Booking" }, direction: DOWN, timeout: 15000 }
- tapOn: "Place Booking"
- extendedWaitUntil: { visible: "Booking created successfully", timeout: 25000 }
- takeScreenshot: d1-booking-A-created
- tapOn: "Back to Home"
- extendedWaitUntil: { visible: "What service do you need today?", timeout: 15000 }

# ── Booking B (same service · same address) → duplicate WARNING ────────────────
- tapOn: ".*House Cleaning.*"
- extendedWaitUntil: { visible: "Your Address", timeout: 15000 }
- tapOn: "Enter address manually"
- extendedWaitUntil: { visible: "123 Main St, City", timeout: 8000 }
- tapOn: "123 Main St, City"
- inputText: "QA-DUP ${MARKER} Rd Nairobi"
- tapOn: "Your Address"
- scrollUntilVisible: { element: { text: "Continue" }, direction: DOWN, timeout: 15000 }
- tapOn: "Continue"
- extendedWaitUntil: { visible: "When do you need it?", timeout: 15000 }
- tapOn: ".*ASAP.*"
- scrollUntilVisible: { element: { text: "Continue" }, direction: DOWN, timeout: 15000 }
- tapOn: "Continue"
- extendedWaitUntil: { visible: "Any special notes?", timeout: 15000 }
- tapOn: "E.g. use the back entrance, bring your own supplies…"
- inputText: "${MARKER}"
- tapOn: "Any special notes?"
- scrollUntilVisible: { element: { text: "Continue" }, direction: DOWN, timeout: 15000 }
- tapOn: "Continue"
- extendedWaitUntil: { visible: "Review your booking", timeout: 15000 }
- scrollUntilVisible: { element: { text: "Place Booking" }, direction: DOWN, timeout: 15000 }
- tapOn: "Place Booking"

# The advisory duplicate warning (native Alert) must appear — booking NOT yet created.
- extendedWaitUntil: { visible: ".*already have an active.*", timeout: 15000 }
- assertVisible: "View existing booking"
- assertVisible: "Book another anyway"
- takeScreenshot: d2-duplicate-warning

# "Book another anyway" explicitly authorizes a NEW booking → it is created.
- tapOn: "Book another anyway"
- extendedWaitUntil: { visible: "Booking created successfully", timeout: 25000 }
- takeScreenshot: d3-book-anyway-created
