# Phase 3F — Customer review submission (after job completion).
# Creds via -e; the completed House Cleaning booking must exist + be assigned.
appId: com.quickserve.app
---
- launchApp: { clearState: true }
- extendedWaitUntil: { visible: "Get Started", timeout: 30000 }
# After cold start the welcome can render before expo-router is interactive; tap the login
# button repeatedly (only while still on welcome) until the sign-in screen appears.
- repeat:
    times: 8
    commands:
      - runFlow:
          when:
            visible:
              id: "login-link"
          commands:
            - tapOn:
                id: "login-link"
            - extendedWaitUntil:
                visible: "Welcome back"
                timeout: 3000
                optional: true
- extendedWaitUntil: { visible: "Welcome back", timeout: 10000 }
- tapOn: "you@example.com"
- inputText: "${CUST_EMAIL}"
- tapOn: "Your password"
- inputText: "${CUST_PW}"
- hideKeyboard
- tapOn: "Continue"
# iOS may prompt for notifications after sign-in; decline (do not grant unrelated permissions).
- runFlow: { when: { visible: "Don.t Allow" }, commands: [ { tapOn: "Don.t Allow" } ] }
- extendedWaitUntil: { visible: "What service do you need today?", timeout: 25000 }
- tapOn: "My Bookings"
# iOS groups the booking-card texts into one combined accessibility label; .*…* matches it
# (and still matches the standalone Android text node).
- extendedWaitUntil: { visible: ".*House Cleaning.*", timeout: 15000 }
- tapOn: ".*House Cleaning.*"
- extendedWaitUntil: { visible: "Booking Detail", timeout: 15000 }
- runFlow: { when: { visible: "No thanks" }, commands: [ { tapOn: "No thanks" } ] }
- assertVisible: ".*Completed.*"
# Review section
- scrollUntilVisible: { element: { text: "Your review" }, direction: DOWN, timeout: 15000 }
- tapOn: { id: "star-5" }
- tapOn: "Share your experience…"
- inputText: "${COMMENT}"
- hideKeyboard
- scrollUntilVisible: { element: { text: "Submit review" }, direction: DOWN, timeout: 15000 }
- tapOn: "Submit review"
- extendedWaitUntil: { visible: "Edit review", timeout: 20000 }
- takeScreenshot: c5-review-submitted
