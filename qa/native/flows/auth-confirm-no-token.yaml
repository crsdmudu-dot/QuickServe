# Auth confirmation route — fail-closed check, NO token. ASSERTIONS ONLY.
#
# The signup-confirmation twin of auth-recovery-no-token.yaml. The workflow prepares the app and
# delivers the link before this flow runs: it reinstalls the build, cold-launches it signed out,
# then fires
#   xcrun simctl openurl "$DEVICE_ID" "kwikserve://auth/confirm"
#
# Delivery is NOT done here, for the reason recorded in the recovery flow: Maestro's `openLink`
# raises the iOS system alert "Open in "KwikServe"?" and nothing taps it, so the link never
# reaches the app. There is likewise no launchApp, no clearState and no navigation, because
# relaunching would discard the routing under observation.
#
# Deliberately read-only: nothing typed, no credential, no auth action tapped, no QA data created.
appId: ke.co.hiredcorp.kwikserve
---
# iOS asks "Open in "KwikServe"?" before handing a custom-scheme URL to an app, whatever delivered
# it (runs 34838315160 and 34867318992 both hit the same alert). Confirming it is part of the real
# journey; conditional so the flow skips it if a future iOS stops asking. This is the ONLY tap in
# the flow, and it confirms a link open, nothing else.
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"

# The route must now be showing the single neutral state.
- extendedWaitUntil:
    visible: "This link is invalid or has expired."
    timeout: 30000
- assertVisible: "Confirm your email"
- assertVisible: "Sign in to request a new confirmation email."
- assertVisible: "Go to sign in"
- takeScreenshot: 01-auth-confirm-no-token-invalid

# It must fail CLOSED: no confirmation success, no session, no onward navigation of its own.
- assertNotVisible: "Email confirmed"
- assertNotVisible: "Your email is confirmed"
- assertNotVisible: "Welcome back"

# Still on the neutral state after settling (no late redirect, no crash).
- extendedWaitUntil:
    visible: "This link is invalid or has expired."
    timeout: 5000
- takeScreenshot: 02-auth-confirm-still-closed
