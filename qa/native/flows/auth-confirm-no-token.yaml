# Auth confirmation route — fail-closed check, NO token.
#
# The signup-confirmation twin of auth-recovery-no-token.yaml. Opens the canonical confirmation
# deep link with NO parameters and asserts the same single neutral state, so a link carrying
# nothing is indistinguishable from one that expired.
#
# Deliberately read-only. Nothing is typed, no credential is used, no button that would start an
# auth request is tapped, and the run starts from a cleared state so no session can exist. No
# marker and no cleanup trap, because no QA data is created. If a future edit adds a sign-in or a
# resend here, it must add scoping and cleanup.
#
# Run: maestro test qa/native/flows/auth-confirm-no-token.yaml
appId: ke.co.hiredcorp.kwikserve
---
# Cold, signed-out start.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Get Started"
    timeout: 30000
- takeScreenshot: 01-auth-confirm-cold-start

# The emailed link, stripped of everything. No token_hash, no type, no redirect.
- openLink: kwikserve://auth/confirm
- extendedWaitUntil:
    visible: "This link is invalid or has expired."
    timeout: 20000
- assertVisible: "Confirm your email"
- assertVisible: "Sign in to request a new confirmation email."
- assertVisible: "Go to sign in"
- takeScreenshot: 02-auth-confirm-no-token-invalid

# It must fail CLOSED: no confirmation success, no session, no onward navigation of its own.
- assertNotVisible: "Email confirmed"
- assertNotVisible: "Your email is confirmed"
- assertNotVisible: "Welcome back"

# Still alive and still on the neutral state after settling (no late redirect, no crash).
- extendedWaitUntil:
    visible: "This link is invalid or has expired."
    timeout: 5000
- takeScreenshot: 03-auth-confirm-still-closed
