# Auth recovery route — fail-closed check, NO token.
#
# Opens the canonical recovery deep link with NO parameters at all and asserts the app refuses it
# with the single neutral state. This is the whole point of the flow: a link that carries nothing
# must look exactly like a link that carried something expired, so the screen can never be used to
# tell a real token from a fake one.
#
# Deliberately read-only. Nothing is typed, no credential is used, no button that would start an
# auth request is tapped, and the run starts from a cleared state so no session can exist. There is
# no marker and no cleanup trap because there is no QA data to clean up. If a future edit adds a
# sign-in or a request here, it must add scoping and cleanup — do not let this stay trap-less by
# accident.
#
# Run: maestro test qa/native/flows/auth-recovery-no-token.yaml
appId: ke.co.hiredcorp.kwikserve
---
# Cold, signed-out start.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Get Started"
    timeout: 30000
- takeScreenshot: 01-auth-recovery-cold-start

# The emailed link, stripped of everything. No token_hash, no type, no redirect.
- openLink: kwikserve://auth/recovery
- extendedWaitUntil:
    visible: "This link is invalid or has expired."
    timeout: 20000
- assertVisible: "Reset your password"
- assertVisible: "Reset links can only be used once and expire after a short time."
- assertVisible: "Request a new link"
- takeScreenshot: 02-auth-recovery-no-token-invalid

# It must fail CLOSED: no password form, no success path, no session.
- assertNotVisible: "New password"
- assertNotVisible: "Save new password"
- assertNotVisible: "Password updated"
- assertNotVisible: "Welcome back"

# Still alive and still on the neutral state after settling (no late redirect, no crash).
- extendedWaitUntil:
    visible: "This link is invalid or has expired."
    timeout: 5000
- takeScreenshot: 03-auth-recovery-still-closed
