# Phase 3F — Native entry-point reachability probe.
#
# Documents the Phase 3F BLOCKER: on the native Android build the default
# unauthenticated entry is the (admin-web) "Admin Panel" login, and the customer/
# provider onboarding (/welcome) is NOT reachable — neither as the default route nor
# via the app's custom-scheme deep links. This flow asserts the ACTUAL behaviour
# (admin login is shown) and demonstrates that a deep link to /welcome does not route
# there. It is EVIDENCE of the blocker, not a passing customer journey.
#
# Run: qa\native\maestro.bat test qa\native\flows\entry-reachability.yaml
appId: com.quickserve.app
---
# 1) Fresh launch → the app lands on the admin login, not customer onboarding.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Sign in with your admin account."
    timeout: 30000
- takeScreenshot: 01-default-entry-is-admin-login
# 2) A custom-scheme deep link to the customer onboarding does NOT route there:
#    the admin login remains; "Get Started" (welcome) never appears.
- openLink: quickserve:///welcome
- assertVisible: "Sign in with your admin account."
- assertNotVisible: "Get Started"
- takeScreenshot: 02-welcome-deeplink-still-admin-login
